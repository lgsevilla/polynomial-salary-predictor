<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Polynomial Salary Predictor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            margin-bottom: 24px;
            font-size: 24px;
            color: #333;
        }
        input[type="number"] {
            padding: 10px;
            width: 100%;
            font-size: 16px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #444;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Polynomial Salary Predictor</h1>
    <form method="POST">
        <input type="number" step="any" name="level" required placeholder="Enter position level (e.g. 6.5)" min="1">
        <button type="submit">Predict</button>
    </form>
    {% if prediction is not none %}
    <div class="result">Predicted Salary: ${{ prediction }}</div>
    <div>
        <img src="{{ url_for('static', filename='prediction.png') }}" alt="Prediction Plot" style="margin-top: 20px; max-width: 100%;">
    </div>
    {% endif %}

    {% if error %}
    <div class="result" style="color: red;">{{ error }}</div>
    {% endif %}
</div>
</body>
</html>
